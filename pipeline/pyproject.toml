[project]
name = "greek-tts"
version = "0.1.0"
description = "Build step for the Greek vocab quiz: TTS generation, clipping, and QA"
readme = "README.md"
# Pinned to 3.12: faster-whisper / ctranslate2 wheels lag behind the newest Python.
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.14.5",
    "edge-tts>=7.3.1",
    "faster-whisper>=1.2.1",
    "numpy>=2.5.4",
]

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
